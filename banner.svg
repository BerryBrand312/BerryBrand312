<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hi, I'm Beri – Making AI understandable, useful and responsible. Build · Explain · Question">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: fadeUp 0.8s ease-out both; }
    .pop { animation: pop 0.5s ease-out both; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.5s; }
    .d3 { animation-delay: 0.8s; }
    .d4 { animation-delay: 1.2s; }
    .d5 { animation-delay: 1.7s; }
    .d6 { animation-delay: 1.95s; }
    .d7 { animation-delay: 2.2s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .in, .pop { animation: none; } }
  </style>
  <rect width="1200" height="380" rx="20" fill="#4B1528"/>
  <text class="in d1" x="600" y="78" text-anchor="middle" font-size="26" fill="#F4C0D1">Hi, I'm Beri</text>
  <text class="in d2" x="600" y="148" text-anchor="middle" font-size="52" font-weight="600" fill="#FBEAF0">Making AI understandable,</text>
  <text class="in d3" x="600" y="212" text-anchor="middle" font-size="52" font-weight="600" fill="#FBEAF0">useful and responsible</text>
  <text class="in d4" x="600" y="264" text-anchor="middle" font-size="24" fill="#ED93B1">Business AI @ FHNW · Marketing and communication background</text>
  <g class="pop d5">
    <rect x="408" y="298" width="120" height="40" rx="10" fill="#993556"/>
    <text x="468" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#FBEAF0">Build</text>
  </g>
  <g class="pop d6">
    <rect x="540" y="298" width="120" height="40" rx="10" fill="#D4537E"/>
    <text x="600" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#FBEAF0">Explain</text>
  </g>
  <g class="pop d7">
    <rect x="672" y="298" width="120" height="40" rx="10" fill="#F4C0D1"/>
    <text x="732" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#4B1528">Question</text>
  </g>
</svg>
